name: CI

on:
  push:
    branches: [ "main", "develop", "dev" ]
  pull_request:
    branches: [ "main", "develop", "dev" ]

# Cancel in-progress runs for the same branch/PR when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dotnet-version: [ "10.0.x" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: >
          dotnet test
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()   # upload even on test failure so results are inspectable
        with:
          name: test-results-dotnet-${{ matrix.dotnet-version }}
          path: ./TestResults/**/*.trx
          retention-days: 14

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-dotnet-${{ matrix.dotnet-version }}
          path: ./TestResults/**/coverage.cobertura.xml
          retention-days: 14

  # Lightweight gate job — require this in branch protection rules instead of
  # listing every matrix job individually.
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
